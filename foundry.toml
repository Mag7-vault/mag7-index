[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
robinhood_chain = "${ROBINHOOD_CHAIN_RPC}"

[etherscan]
robinhood_chain = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api" }

# forge test -vvv
# forge script script/Deploy.s.sol --rpc-url robinhood_chain --broadcast --verify
